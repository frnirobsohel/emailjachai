# Email Jachai — Dokploy / Coolify Optimized Compose
#
# ┌─────────────────────────────────────────────────────────────────┐
# │  DOKPLOY SETUP GUIDE                                           │
# │                                                                 │
# │  1. Create Application → Compose                               │
# │  2. Paste this file (or link your GitHub repo + this path)     │
# │  3. Add Domains in Dokploy UI:                                 │
# │       app.yourdomain.com  → frontend  port 3000               │
# │       api.yourdomain.com  → backend   port 8000               │
# │  4. Set Environment Variables (copy from .env.example)         │
# │  5. Click Deploy                                               │
# │                                                                 │
# │  Scale workers: Dokploy UI → Replicas slider → worker = N     │
# └─────────────────────────────────────────────────────────────────┘
#
# Dokploy handles SSL (via Traefik) automatically — no Caddy needed.

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ejp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-ejp}
    volumes:
      - ejp_pg:/var/lib/postgresql/data
    networks:
      - ejp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ejp} -d ${POSTGRES_DB:-ejp}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ejp_redis:/data
    networks:
      - ejp_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ── Backend API ───────────────────────────────────────────────────────────
  # Dokploy Domain: api.yourdomain.com → port 8000
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GO_ENV: production
      ENVIRONMENT: production
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      WORKER_API_KEY: ${WORKER_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      BULK_RESULTS_PATH: /app/storage/results/bulk
      BULK_SOURCE_PATH: /app/storage/jobs/bulk
      SINGLE_RESULTS_PATH: /app/storage/results/single
      SMTP_VERIFY_TIMEOUT_SEC: ${SMTP_VERIFY_TIMEOUT_SEC:-135}
      SMTP_MAX_CONCURRENT: ${SMTP_MAX_CONCURRENT:-25}
      DNS_RESOLVERS: ${DNS_RESOLVERS:-8.8.8.8,1.1.1.1}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    volumes:
      - ejp_storage:/app/storage
    ports:
      - "8000"    # Dokploy Traefik will route here
    networks:
      - ejp_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ── Worker Engine ─────────────────────────────────────────────────────────
  # Scale in Dokploy UI: Replicas → worker = N
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      GO_ENV: production
      REDIS_URL: ${REDIS_URL}
      API_BASE_URL: ${API_BASE_URL:-http://backend:8000/api/v1/internal}
      WORKER_API_KEY: ${WORKER_API_KEY}
      WORKER_SERVER_NAME: ${WORKER_SERVER_NAME:-worker-1}
      SMTP_VERIFY_TIMEOUT_SEC: ${SMTP_VERIFY_TIMEOUT_SEC:-135}
      SMTP_HELO_HOSTNAME: ${SMTP_HELO_HOSTNAME:-}
      DNS_RESOLVERS: ${DNS_RESOLVERS:-8.8.8.8,1.1.1.1}
    networks:
      - ejp_net

  # ── Frontend ──────────────────────────────────────────────────────────────
  # Dokploy Domain: app.yourdomain.com → port 3000
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      API_BASE_URL: http://backend:8000/api/v1
      FRONTEND_URL: ${FRONTEND_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    ports:
      - "3000"    # Dokploy Traefik will route here
    networks:
      - ejp_net

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  ejp_pg:
  ejp_redis:
  ejp_storage:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  ejp_net:
    driver: bridge
