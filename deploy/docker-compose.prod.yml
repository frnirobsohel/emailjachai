# Email Jachai — Production Docker Compose
# Includes Caddy reverse proxy with automatic Let's Encrypt SSL.
#
# Usage:
#   bash deploy/install.sh          ← Recommended (auto-generates .env)
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
#
# Scaling workers (add more any time):
#   docker compose ... up -d --scale worker=5
#
# Multi-replica API (requires shared storage volume):
#   docker compose ... up -d --scale backend=3
#   Set SHARED_STORAGE=required in .env

services:

  # ── Reverse Proxy (Caddy) ─────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: ejp_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 QUIC
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ejp_caddy_data:/data
      - ejp_caddy_config:/config
    environment:
      APP_HOST: ${APP_HOST:-localhost}
    depends_on:
      - backend
      - frontend
    networks:
      - ejp_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ejp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ejp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ejp}
    volumes:
      - ejp_pg:/var/lib/postgresql/data
    networks:
      - ejp_net
    # Do NOT expose 5432 externally in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ejp} -d ${POSTGRES_DB:-ejp}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ejp_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly no
    volumes:
      - ejp_redis:/data
    networks:
      - ejp_net
    # Do NOT expose 6379 externally in production
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 300M

  # ── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GO_ENV: production
      ENVIRONMENT: production
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WORKER_API_KEY: ${WORKER_API_KEY:?WORKER_API_KEY is required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      BULK_RESULTS_PATH: ${BULK_RESULTS_PATH:-/app/storage/results/bulk}
      BULK_SOURCE_PATH: ${BULK_SOURCE_PATH:-/app/storage/jobs/bulk}
      SINGLE_RESULTS_PATH: ${SINGLE_RESULTS_PATH:-/app/storage/results/single}
      SMTP_VERIFY_TIMEOUT_SEC: ${SMTP_VERIFY_TIMEOUT_SEC:-135}
      SMTP_MAX_CONCURRENT: ${SMTP_MAX_CONCURRENT:-25}
      DNS_RESOLVERS: ${DNS_RESOLVERS:-8.8.8.8,1.1.1.1}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      SHARED_STORAGE: ${SHARED_STORAGE:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ejp_storage:/app/storage
    networks:
      - ejp_net
    # Not exposed directly — Caddy proxies /api → backend:8000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Worker Engine ─────────────────────────────────────────────────────────
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      GO_ENV: production
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      API_BASE_URL: ${API_BASE_URL:-http://backend:8000/api/v1/internal}
      WORKER_API_KEY: ${WORKER_API_KEY:?WORKER_API_KEY is required}
      WORKER_SERVER_NAME: ${WORKER_SERVER_NAME:-worker-1}
      SMTP_VERIFY_TIMEOUT_SEC: ${SMTP_VERIFY_TIMEOUT_SEC:-135}
      SMTP_HELO_HOSTNAME: ${SMTP_HELO_HOSTNAME:-}
      DNS_RESOLVERS: ${DNS_RESOLVERS:-8.8.8.8,1.1.1.1}
      SENTRY_DSN: ${SENTRY_DSN:-}
    networks:
      - ejp_net
    deploy:
      # Increase replicas for more throughput: docker compose ... up -d --scale worker=5
      replicas: 1
      resources:
        limits:
          memory: 256M

  # ── Frontend Dashboard ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time args baked into the Next.js bundle
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/api/v1/ws}
        JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      # Internal API URL — NOT the public Caddy URL (avoids Traefik header issues)
      API_BASE_URL: ${API_BASE_URL_INTERNAL:-http://backend:8000/api/v1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/api/v1/ws}
    networks:
      - ejp_net
    # Not exposed directly — Caddy proxies / → frontend:3000
    deploy:
      resources:
        limits:
          memory: 512M

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  ejp_pg:
    name: ejp_pg
  ejp_redis:
    name: ejp_redis
  ejp_storage:
    name: ejp_storage
  ejp_caddy_data:
    name: ejp_caddy_data
  ejp_caddy_config:
    name: ejp_caddy_config

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  ejp_net:
    name: ejp_net
    driver: bridge
